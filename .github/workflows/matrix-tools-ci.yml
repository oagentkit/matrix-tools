name: Matrix Tools CI

# 本仓是全矩阵的单一数据源：modules.json 决定 versions.json / llms.txt / 文档 /
# 全部门禁的判定。改错一个包名，下游是「静默失效」而不是「报错」。
#
# 为什么这里必须有 CI：oagentkit/.github 的 matrix-docs job 拉的是本仓的 **main**，
# 不是 PR 分支。所以本仓的 PR 此前**从不被任何东西验证**——
# 新加的守卫脚本要在合并之后才第一次被执行，且失败时已经晚了。
# （实测：verify_facade_release.py 的 PR 就出现过这种顺序依赖，
#   .github 侧先红，报的是「文件不存在」而不是「守卫坏了」。）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每日全矩阵对账。
    #
    # 为什么需要定时跑：这两条门禁守的是「矩阵 vs 各模块仓的真实状态」，
    # 而**模块仓发版不会触发本仓的 CI**——矩阵没改就没有 PR，PR 触发的门禁
    # 也就永远不会看到那次发版。定时跑是唯一能在「别人改了模块仓」时
    # 把矩阵漂移照出来的机制。
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::py_compile ${f}"
            python3 -m py_compile "$f" || fail=1
            echo "::endgroup::"
          done < <(find scripts -name '*.py' -not -path '*/__pycache__/*' | sort)
          exit "$fail"

      - name: --help 冒烟
        # argparse 的脚本必须能被解析出参数；无 argparse 的脚本只要求能跑起来
        # 并以 0/1/2 退出（--help 返回 2 也算通过）。
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::${f} --help"
            set +e
            python3 "$f" --help >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -gt 2 ]; then
              echo "  ✗ exit ${rc}"
              fail=1
            else
              echo "  ✓ exit ${rc}"
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.py' -not -path '*/__pycache__/*' | sort)
          exit "$fail"

      - name: 路径规则自洽
        # matrix_paths 是「旧→新 import 路径」的规则本体，
        # rewrite_imports / gen_versions / gen_llms_txt 全都 import 它。
        # 规则写错时三处会**一致地错**，普通检查抓不到，所以要有独立断言。
        run: python3 scripts/test_matrix_paths.py

  guards:
    name: Guards self-test
    # 守卫最危险的失效模式是「一直绿，但从没生效过」：
    # 豁免名单写错一个字符、判据写反，它就会静默放过所有违规。
    # 所以每条守卫都必须能证明自己还活着。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 pyyaml
        # verify_inventory 的触发条件校验要解析 workflow YAML。
        # 显式装，不靠 runner 镜像/解释器预装的 pyyaml——那是不确定因素。
        # 写法沿用 .github/workflows/repo-ci.yml 里已有的兜底。
        run: python3 -m pip install --quiet pyyaml

      - uses: actions/setup-go@v5
        with:
          # 门面符号级门禁的符号提取器是 scripts/symdump/main.go（go/parser
          # 程序，只用标准库），但仍需 Go 工具链。显式装一个定版——
          # 不靠 runner 镜像预装的 Go 版本，那是不确定因素。
          go-version: '1.26'

      - name: 门面仓退役守卫自测
        run: python3 scripts/check_facade_imports.py --selftest

      - name: 门面包冻结守卫自测（门面已废弃，不得再长出新包）
        # 门面仓 README 明写「v1.x 退役条件**已满足**，本仓不接受任何新功能」。
        # 「不许再引门面」有机器约束（check_facade_imports.py），
        # 但「门面不得继续长出新包」此前**一条机器约束都没有**——有人加一个新包目录
        # + 一批别名，CI 全绿。这条守卫把那句文档承诺变成红灯。
        #
        # 自测覆盖（离线、真实逻辑，不 mock 判定函数）：
        # 与基线一致→绿 / 新增包→红 / 删包（上游删除场景）→绿 / 新增转发目标→红 /
        # 数量相同但集合不同→红（负向样本）/ 门面自研包→红 / 空门面→判不了。
        run: python3 scripts/verify_facade_frozen.py --selftest

      - name: 门面仓发布地板守卫自测
        # 判据里含「门面接 v0.1.0」这个样本 —— 那是线上真实发生过的形态
        # （agentkit@v1.2.0 的 go.mod 把 13 个内部依赖全钉在 v0.1.0）。
        run: python3 scripts/verify_facade_release.py --selftest

      - name: 依赖地板守卫自测
        # 这条守卫有过一次真实的静默失效：owner/repo 拆分把 owner 拼成
        # "github.com/oagentkit"，于是每个依赖都查不到 tag，报告里 43 条
        # 全是「判不了」却照样 exit 0 —— 一直绿、从没生效过。
        # 所以它的判据纯函数部分必须离线可测，不能只靠联网跑一次。
        run: python3 scripts/verify_dep_floors.py --selftest

      - name: 破坏性变更抽取器自测
        # breakingIndex 的判定规则本体。判据错了整条门禁就是摆设：
        # 漏判 → 矩阵继续说「无破坏性变更」；误判 → 矩阵里塞满假条目。
        run: python3 scripts/breaking_index.py

      - name: 仓库元信息取数层自测
        # tag 过滤必须只认 ^vX.Y.Z：嵌套模块的 tag（audit/v0.1.0）与主模块的
        # tag 在同一个仓里，取错「最新」会把矩阵写成 v0.1.0。
        run: python3 scripts/repo_meta.py

      - name: breakingIndex 对账门禁自测
        run: python3 scripts/verify_breaking_index.py --selftest

      - name: import 路径对账门禁自测
        run: python3 scripts/verify_import_paths.py --selftest

      - name: 门面符号级完整性门禁自测
        # oracle 有效性自测：拿一个**有盲区的被检对象**跑一遍，确认它报得出。
        # 如果 oracle 自己也有同一处盲区，它会对着坏对象说「没问题」，
        # 那门禁就是假通过。样本含八类缺陷：漏转发 / 幽灵转发 / const 降级成 var /
        # type 降级成 var / 泛型函数被误转发 / 泛型函数未登记白名单 /
        # 白名单过期 / 泛型类型不误报。
        run: python3 scripts/verify_facade_symbols.py --selftest

      - name: breakingIndex 独立 oracle 门禁自测
        # 反证：旧解析器（breaking_index.py）漏收的形态——粗体 **BREAKING**、
        # 项目符号里的 BREAKING CHANGE、小写 breaking change、散文描述的
        # import 路径搬家——独立 oracle 必须全部收得到。自测里拿旧解析器
        # 跑同一份样本，确认它确实漏，才能证明 oracle 不是同一处盲区。
        run: python3 scripts/verify_breaking_oracle.py --selftest

      - name: tag ↔ CHANGELOG 对账门禁自测
        # 双向一一对应 / 待发版段豁免 / 存量欠账基线 / 快照里没有 CHANGELOG 豁免。
        run: python3 scripts/verify_changelog_at_tag.py --selftest

      - name: 欠账基线缓解门禁自测
        # 这条门禁要防的失效形态是「基线文件自己变成可写的豁免」：
        # 写一行 "mitigated" 就能让欠账变绿。
        # 所以自测必须证明**台账字段无论怎么写都改不动判定**——
        # 反证 A（换事实 ⇒ 结论变）/ B（台账全写已缓解 ⇒ 危害那条仍红）/
        # C（判不了的那条不因台账而转绿）。
        run: python3 scripts/verify_debt_mitigation.py --selftest

      - name: CHANGELOG 覆盖门禁自测（独立 oracle）
        # 两级覆盖判据（issue matrix-tools#41）：条目级 + body 级。
        # 自测含五组：漏条目 / 正文缺失 / 零信息量提交不误报 /
        # 「tag 后有提交但无待发版段 → 不报红」/ subject 回声不误报。
        run: python3 scripts/verify_changelog_coverage.py --selftest

      - name: 发版时刻地板时效门禁自测
        run: python3 scripts/verify_tag_floor.py --selftest

      - name: 依赖地板抬高抽取器自测
        # floorBumps 的抽取规则本体。判据错了整条登记就是摆设：
        # 漏判 → 矩阵继续说「这一版不会让你的构建红」；
        # 误判 → 登记里塞满假的「要 tidy」。
        run: python3 scripts/gen_floor_bumps.py --selftest

      - name: 依赖地板抬高对账门禁自测（独立 oracle）
        # 反证：自测里把 oracle 的「新增依赖」那一路阉割后，
        # 结论必须变——否则自测没有区分力，门禁是「一直绿、从没生效过」。
        run: python3 scripts/verify_floor_bumps.py --selftest

      - name: CHANGELOG 生成器自测（预写→提交→打 tag 端到端自洽）
        # 生成器最危险的失效形态是「看起来生成了正确的文件，但与事后重生成
        # 的结果不一致」——不跑完整流程发现不了，而后果是 .github 的
        # 「各仓 CHANGELOG 未过期」门禁永远红、且越修越红。
        # 自测跑完整流程（临时 git 仓），要求事后重生成与提交版逐字节一致，
        # 且覆盖「直推打 tag」与「走 PR 打 tag」两种发版打法。
        run: python3 scripts/gen_changelogs.py --selftest

      - name: 依赖地板门禁自测
        # tier0/tier1 的地板必须为空——零依赖核心靠这条保证。
        # 这条守卫最危险的失效形态是「豁免名单写太宽」，所以自测里带了负向样本。
        # 自测同时覆盖 depFloor 对账（漏登记 / 多登记 / 内容漂移三个负向样本）——
        # 离线 drift job 忽略 depFloor 之后，它就是这个字段唯一的守门人。
        run: python3 scripts/verify_dep_floor.py --selftest

      - name: Go 地板门禁自测
        # tier0 的 go 指令必须 1.24.x，且 CI go-version 与 go.mod 成对。
        # 自测带负向样本：tier0 地板抬高 / toolchain 超标 / CI 不成对 / 判不了即红，
        # 同时带**不误报**样本——tier1/tier2/tier3 用 1.26 是合法的，不能报成漂移。
        run: python3 scripts/verify_go_floor.py --selftest

      - name: 事实层与报告层自测
        # matrix_facts 是所有新守卫共用的**取数层**，judge_report 是共用**渲染层**。
        # 它们一旦坏了，所有新守卫会一起错——所以必须单独自测。
        run: |
          set -euo pipefail
          python3 scripts/matrix_facts.py --selftest
          python3 scripts/judge_report.py --selftest

      - name: 第一方依赖方向门禁自测
        # 反证样本：tier 倒挂 / 依赖未声明 / 声明陈旧 / 矩阵内消费门面，
        # 以及**不误报**样本（合规依赖、indirect require 不算直接依赖）。
        run: python3 scripts/verify_import_direction.py --selftest

      - name: 待发版段可观测性门禁自测
        # 反证样本：预写段被重生成吞掉的历史必须被检出；补回后必须转绿。
        run: python3 scripts/verify_pending_release.py --selftest

      - name: latest 字段对账门禁自测
        # 陈旧 latest 判红；**取不到判黄而不是判绿**（判不了 ≠ 没问题）。
        run: python3 scripts/verify_latest_field.py --selftest

      - name: 门面不得新增包门禁自测
        # 规则级判定：废弃声明之后新增的包必须判红；被基线吸收的判黄。
        run: python3 scripts/verify_facade_no_new_packages.py --selftest

      - name: 门面包覆盖与迁移映射门禁自测
        # 含迁移映射表的反证样本：门面包缺映射行 / 空映射 / 表与实现漂移。
        run: python3 scripts/verify_facade_packages.py --selftest

      - name: 不变量登记表门禁自测
        # 登记表自己的守门人：未登记的守卫 / 未接线的判据 / 未披露的耦合。
        run: python3 scripts/verify_inventory.py --selftest

      - name: 版本漂移方向判定自测
        # 源陈旧与副本陈旧要给**不同**的修法——照错方向修会把站点降级。
        run: python3 scripts/verify_versions_drift.py --selftest

      - name: issue 回执落地门禁自测
        # 反证样本：把「被 PR 自动关闭」这一路掐掉后，llm#29 形态的缺口必须检不出；
        # 反过来把「回执识别」掐掉后，有回执的必须变成报红。
        # 自测没有区分力 ⇒ 门禁是「一直绿、从没生效过」。
        run: python3 scripts/verify_receipts.py --selftest

      - name: 幽灵包守卫自测
        # 反证样本：幽灵包 / **嵌套**幽灵包 / 测试专用包 / 登记了但仓里没有 必报，
        # 合规仓与 SKIP 名单（cmd/internal/…）不误报。
        # 这条守卫此前对嵌套包与测试专用包**完全失明**（口径只扫仓根直接子目录
        # 且要求含非测试 .go 文件），而这两种形态 `go build ./... && go test ./...`
        # 全绿 ⇒ 幽灵包可以存在于 CI 完全看不见的地方。
        run: python3 scripts/verify_ghost_packages.py --selftest

      - name: 文档陈旧引用守卫自测
        # 反证样本：裸写死包路径必报；**不误报**样本同样重要（误报是这类扫描的
        # 主要风险）：迁移箭头 / 已退役章节 / 宣布退役的引用块 / URL / CHANGELOG。
        run: python3 scripts/scan_stale_refs.py --selftest

      - name: llms.txt 防漂移守卫自测
        # 反证样本：llms.txt 与 modules.json 漂移（多行 / 少行 / 整体换掉）必红，
        # 一致判绿，--fix 能修回。
        run: python3 scripts/verify_docs.py --selftest

      - name: 仓文档漂移报告器自测
        # 这条是**报告器**（恒不失败），但报告器同样要能自证还活着：
        # 漂移必报、一致/缺文档/缺仓不报，且守住核心承诺——**只报告不覆盖**
        # （手写内容被抹掉是它存在的理由）。
        run: python3 scripts/verify_repo_docs.py --selftest

      - name: 站点 modules.json 副本守卫自测
        # 反证样本：少一个包（2026-10-21 真实形态——站点副本缺 llm/port）/
        # 改 tier / 多一个仓 / 少一个顶层字段 / 副本缺失 / JSON 损坏 /
        # 嵌套字段被改 / packages 顺序乱 ⇒ 必报；完全一致 ⇒ 不报。
        run: python3 scripts/verify_modules_copy.py --selftest

  changelog-coverage:
    name: CHANGELOG coverage (独立 oracle)
    # 「两级覆盖」门禁（issue matrix-tools#41）：直接扫**原始 git 历史**算「应当出现的
    # 条目与正文」，与提交版 CHANGELOG.md 比对。
    #
    # 为什么必须**独立于生成器**：门禁若复用 gen_changelogs.py 的解析/渲染函数，
    # 生成器丢 body 时门禁会跟着一起丢——门禁比的正是「丢 body 之后的结果」，
    # 于是门禁全绿而发布说明已经残缺。实测 2026-10-20：7 个仓合计 773 处正文缺失，
    # 逐字节门禁一条都没报出来。
    #
    # 范围按「**谁造成漂移谁负责**」裁剪（issue #41 裁决 2）：
    #   PR 事件 → 只校验**本 PR 触及的仓**（= PR 的 base 仓），且用 **PR head** 的
    #             内容校验（只裁剪不换 ref 解决不了问题：合入前各仓 main 上还是旧产物）；
    #   非 PR 事件（push / 定时 / 手动）→ 全矩阵（**周期性全量审计兜底**，不可省，
    #             否则是漏检）。
    #
    # ⚠️ 本 job 在 matrix-tools 自己的 PR 上是**空跑**（matrix-tools 不在
    # 「有 CHANGELOG 要求的仓」清单里 ⇒ 范围为空）——这正是「无关 PR 不因别的仓
    # 欠账而红」。模块仓的 PR 要各自校验自己，需要在
    # oagentkit/.github 的可复用工作流 go-ci.yml 里加同一个 job（**另一个仓**，
    # 本仓改不到）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存各仓克隆
        # 覆盖判据要读**完整历史**（tag 区间 + 每个 commit 的 body），浅克隆不够用。
        # 缓存命中时只需 fetch 增量，省掉每次重新克隆 14 个仓的时间。
        #
        # ⚠️ 缓存的正确性**不依赖**这个 cache——`ensure_clone` 在缓存命中路径上
        # 会把工作树 reset 到远端默认分支的当前状态。
        # 旧实现只 `git fetch --tags`（tag 更新、工作树不动），
        # 于是门禁拿新 tag 比旧 CHANGELOG，报出根本不存在的漂移；
        # 加上缓存键含 run_id（每轮一个新条目）+ 7 天淘汰，
        # 首次克隆之后工作树被永久冻结 ⇒ **假红持续约 7 天**，真实漂移被淹没。
        #
        # 所以键改成**稳定值**（不再每轮存一份新缓存，避免缓存膨胀），
        # 正确性由工作树 reset 保证。
        uses: actions/cache@v4
        with:
          path: ~/.cache/oagentkit/changelog-coverage
          key: changelog-coverage-clones-v2
          restore-keys: |
            changelog-coverage-clones-
            changelog-coverage-

      - name: CHANGELOG 覆盖（独立 oracle；PR 只查本 PR 触及的仓）
        run: python3 scripts/verify_changelog_coverage.py --ci --org oagentkit

  matrix-truth:
    name: Matrix truth (breakingIndex / import paths)
    # 这三条是**矩阵作为机器可读权威源**的底线：
    #   1. breakingIndex 与各仓 CHANGELOG 一致——否则矩阵说「无破坏性变更」，
    #      而 CHANGELOG 说「import 路径已变」，下游只能先构建断裂才发现；
    #   2. importPath 与各仓真实的 go.mod / 包目录一致——否则机器照着矩阵写
    #      import 直接编译不过；
    #   3. depFloor 与各仓真实 go.mod 的实际地板一致——否则消费者按矩阵判断
    #      「import 这个仓会拖进哪些重依赖」时拿到的是过期信息。
    #
    # 三条都要联网（读各仓的 CHANGELOG / go.mod / 目录树），所以单独一个 job。
    # 「取不到」一律判红：守卫最危险的失效形态是「一直绿，但从没生效过」。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 tag 快照
        # tag 受 protect-tags ruleset 保护**不可变** ⇒ 某个 tag 处的 CHANGELOG.md
        # 内容也不可变 ⇒ (repo, tag, commit sha) 是稳定缓存键。
        # 实测（2026-10-20，14 仓 102 个 tag）：冷缓存 116 次 API 调用 / 46s，
        # 热缓存 **14 次 / 26s**。调用次数才是这个 job 的真正风险——
        # 串行取数曾让本地一次跑挂死 7 小时（#26 加超时后缓解）。
        #
        # key 用 run_id（每轮一个新条目，旧的 7 天后被 GitHub 淘汰），
        # restore-keys 用前缀把上一轮的缓存捞回来 ⇒ 只有**新增的 tag** 需要真的取。
        uses: actions/cache@v4
        with:
          path: ~/.cache/oagentkit/changelog-at-tag
          key: changelog-tag-snapshots-${{ github.run_id }}
          restore-keys: |
            changelog-tag-snapshots-

      - name: breakingIndex ↔ 各仓 CHANGELOG
        run: python3 scripts/verify_breaking_index.py --org oagentkit

      - name: import 路径 ↔ 各仓真实 go.mod / 包目录
        run: python3 scripts/verify_import_paths.py --org oagentkit

      - name: breakingIndex ↔ 各仓 CHANGELOG（独立 oracle）
        # 与上面那条**判据完全解耦**的第二条对账线：上面那条用生成器
        # breaking_index.py 的解析函数，生成器漏收时它跟着一起漏、门禁全绿
        # 而矩阵对下游说谎（oekit 与 oagentkit 都实测过这个形态）。
        # 本条自己扫 CHANGELOG 原文判定，两者结论不一致时以本条为准。
        run: python3 scripts/verify_breaking_oracle.py --org oagentkit

      - name: tag ↔ CHANGELOG 版本节一一对应
        # ① 当前 CHANGELOG 与已发布 tag 双向对应（tag 有 → 段有；段有 → tag 有，
        #    唯一豁免是待发版段）；
        # ② 每个已发布 tag 的**快照**里必须有它自己的版本段——下游 go get 拿到的
        #    是 tag 快照，缺段 = 发布说明残缺（issue matrix-tools#17）。
        run: python3 scripts/verify_changelog_at_tag.py --org oagentkit

      - name: 欠账基线的缓解状态（独立重算，不采信基线文件）
        # issue matrix-tools#72：changelog_tag_debt.json 的条目因 protect-tags
        # 不可退休（tag 快照不可变）⇒ 它是**永久豁免清单**；而基线内 stale 只警告
        # 不挡 ⇒ 谁往基线里加一条新欠账，它就变成「已知」而只留一行警告 ⇒
        # **新增欠账被基线吸收、无人可见**。
        #
        # 本条把「条目」与「危害」分开：
        #   条目 = 已发布 tag 的快照里缺自己那段（永远不可退休）；
        #   危害 = 下游读到的**最新 CHANGELOG** 里缺那个版本的段（**可以**消除）。
        # 判据 = 该仓 main 的 CHANGELOG 是否含该版本段。
        #
        # ⚠️ 判定**只用重算结果**：基线文件里的 mitigation.entries 只是账本，
        #    不参与判定——文件声称「已缓解」而重算为「未缓解」⇒ 判红（企图豁免）。
        #    共享判定 = 共同盲区：那个字段自己就会变成新的可写豁免。
        run: python3 scripts/verify_debt_mitigation.py --org oagentkit

      - name: 依赖地板（tier0/tier1 必须无重量级第三方）+ depFloor 对账
        # 一条脚本两件事：① 层位判定（tier0/tier1 地板必须为空）；
        # ② 对账——矩阵 versions.json 登记的 depFloor 必须等于各仓真实
        # go.mod 算出的地板（漏登记 / 多登记 / 内容漂移 / 取不到即红）。
        run: python3 scripts/verify_dep_floor.py --org oagentkit

      - name: Go 地板（tier0 必须 1.24.x）+ CI go-version 与 go.mod 成对
        # ① tier0 的 go 指令必须 1.24.x——tier0 是「需要依赖低版本 Go」的那一类，
        #    抬高地板会把 Go 1.24 用户挡在门外（issue matrix-tools#22）；
        # ② CI go-version 必须与 go.mod 的 go 指令成对——CI 用高版本构建、
        #    go.mod 承诺低版本时，CI 全绿但用户按最低版本编译失败。
        #
        # 判据独立：直接解析各仓 go.mod 与 ci.yml 原文，
        # 不复用任何生成器的推导（共享判断逻辑 = 共同盲区）。
        # tier1 及以上**不设 1.24 约束**——业务层 1.24/1.25/1.26 都合法。
        run: python3 scripts/verify_go_floor.py --org oagentkit

  floor-bumps:
    name: Floor bumps (依赖地板抬高的登记对账)
    # `floorBumps` 登记每一版**抬了依赖地板**的事实。它对下游的意义是：
    # 「这一版会让你的构建红，除非你跑 go mod tidy」。
    # 实测机制（零网络合成样本）：消费方 go.mod 锁 depB v1.0.0、上游 depA v1 → 构建绿；
    # 上游换成 depA v2（地板抬到 v1.1.0 且新增 depC）→
    #   go: updates to go.mod needed, disabled by -mod=readonly; to update it: go mod tidy
    #
    # 判据是**结构性**的：相邻两个 tag 处的 go.mod 差异，与提交说明的措辞无关。
    # （issue matrix-tools#68：此前「地板追平」既不进 breakingIndex，
    #   又被 oracle 的标记行判据误伤——写「隐式 breaking：」判红，写「隐式破坏性变更」没事，
    #   索引内容取决于作者怎么措辞，不是事实。）
    #
    # ⚠️ 需要**完整 tag 历史**：浅克隆只有部分 tag，「相邻 tag」是假的
    #    （看上去没抬地板，其实是没看到那个 tag）——判不了必须判红，不能当绿灯。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: matrix-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone 矩阵各仓（完整历史）
        # 清单来自 modules.json（单一数据源），不写死仓名。
        # 必须完整克隆：浅克隆的 tag 历史不全，算出来的「相邻 tag」是假的。
        run: |
          set -euo pipefail
          while IFS= read -r repo; do
            [ "$repo" = "matrix-tools" ] && continue
            [ "$repo" = "oagentkit.github.io" ] && continue
            [ "$repo" = ".github" ] && continue
            git clone -q "https://github.com/oagentkit/${repo}.git" "${repo}"
          done < <(python3 -c "
          import json, pathlib
          d = json.loads(pathlib.Path('matrix-tools/modules.json').read_text())
          print('\n'.join(m['repo'] for m in d['modules']))
          ")
          # 门面仓不在 modules 里（它不是矩阵模块，是兼容层），单独克隆
          git clone -q "https://github.com/oagentkit/agentkit.git" agentkit

      - name: floorBumps 登记 ↔ 各仓 tag 历史的 go.mod 差异
        # 独立 oracle：自己取 tag、自己解析 go.mod、自己比版本号，
        # **不 import 生成器**（生成器漏收时它跟着一起漏 ⇒ 共同盲区）。
        run: python3 matrix-tools/scripts/verify_floor_bumps.py --root . --versions matrix-tools/versions.json

  release-floor:
    name: Release floor (发版时刻的地板时效)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发版时刻的依赖地板时效（各仓最新 tag）
        run: python3 scripts/verify_tag_floor.py --org oagentkit --latest-only

  facade-symbols:
    name: Facade symbols
    # 门面仓 agentkit 的**符号级**转发完整性：上游每个导出符号，门面都要有对应别名。
    #
    # 为什么值得单独一个 job：已有的三条门面守卫查的都不是符号级——
    #   verify_facade_packages.py 只比包名（47/47 通过）
    #   check_facade_imports.py 只查禁用的 import 前缀
    #   verify_facade_release.py 只查版本地板
    # 实测 2026-10-20：门面的 47 个 alias.go 自 2026-10-17 起就没跟上上游，
    # 漏转发 23 个符号、131 处 const 被降级成 var，下游按门面 import 直接编译失败。
    # 而仓里**根本不存在**那个自称在生成 alias.go 的 gen 生成器——
    # 所以这不是「生成器坏了」，是「生成器从来没有过」。
    #
    # 判据是**独立 oracle**：直接读上游源码与门面 alias.go，用 go/parser
    # （scripts/symdump）解析语法树求差集，不比对任何生成物。
    #
    # 为什么必须联网跑：模块仓发版**不会**触发本仓的 CI（矩阵没改就没有 PR），
    # 所以这里的 schedule 是唯一能在「别人改了模块仓」时把门面漂移照出来的机制
    #（与 matrix-truth job 同一理由）。
    #
    # ⚠️ 顺序依赖（本 job 读的是各仓的 main，不是本仓 PR 的内容）：
    # 「先修门面、再装门禁」是刻意的——门禁验证的正是「门面已修好」这个事实。
    # 若门面还没修好就加这条门禁，本仓 PR 会红，且红的原因与 PR 本身无关。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        # 符号提取器是 go/parser 程序（scripts/symdump/main.go），只用标准库，
        # 但要有 go 工具链。版本与全矩阵一致（CI go-version 1.26）。
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 门禁自测（oracle 有效性）
        # 守卫最危险的失效形态是「一直绿，但从没生效过」：
        # oracle 自己有盲区时，它会对着坏门面说「没问题」，那是假通过。
        # 自测拿一个**故意造坏**的被检对象跑一遍，要求它把每类缺陷都报出来。
        run: python3 scripts/verify_facade_symbols.py --selftest

      - name: 门面符号级转发完整性
        # 取不到即红：守卫最危险的形态是「一直绿，但从没生效过」。
        run: python3 scripts/verify_facade_symbols.py --org oagentkit

  facade-frozen:
    name: Facade frozen (不得长新包)
    # 门面仓 agentkit 已废弃：README 首行「门面仓 · 已废弃」，
    # 「v1.x 退役条件**已满足**。本仓不接受任何新功能，只做别名转发与安全修复」。
    #
    # 为什么值得单独一个 job：已废弃的语义是「只保留既有兼容面、不接受新功能」，
    # 而「新增包」正是门面继续长胖的主要形态。此前这一半**只有文档约束**：
    #   - 「不许再引门面」有机器约束（check_facade_imports.py）；
    #   - 「门面不得再长出新包」**一条机器约束都没有**——有人往门面加一个新包目录
    #     + 一批别名，CI 全绿，只有 48 个 alias.go 的 diff 可见性。
    # 本 job 就是后一条的红灯。
    #
    # 判据是**单向**的：门面的实际包集合 ⊆ 冻结基线
    # （scripts/facade_package_baseline.json，2026-10-20 的人工快照）。
    # 反向不查——上游模块真删包时，门面跟着删是对的（否则 alias.go 编译不过）。
    #
    # ⚠️ 顺序依赖（与 facade-symbols 同理）：本 job 读的是**门面仓 main** 的快照，
    # 不是本仓 PR 的内容。基线与门面当前是对齐的（48 = 48），所以装这条门禁时本仓 PR 是绿的。
    #
    # 「取不到」的处理是分开的：**网络失败/状态判不了 ⇒ 判红**（判不了不能当成「没问题」）；
    # **门面仓确实不存在 ⇒ 判绿**（门面不在 ⇒「门面继续生长」物理上不可能发生）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 门面包冻结（不得新增）
        # 取不到即红：守卫最危险的形态是「一直绿，但从没生效过」。
        run: python3 scripts/verify_facade_frozen.py --org oagentkit

  dep-floors:
    name: Dep floors (report)
    # ⚠️ 这是**报告器**，不是门禁，恒不失败。
    #
    # 依赖地板漂移在设计上就是常态：任何一次子仓发版都会让下游全部变落后。
    # 做成硬门禁等于要求每个仓在每次子仓发版后都跟着发一版，这是发版跑步机，
    # 长期只会训练出「红了就加豁免」的习惯。漂移的**判定**放在
    # `--enforce`（发版 runbook 手动跑），这里只负责让漂移**可见**。
    #
    # 只在 push 到 main / 定时 / 手动时跑，不挂 pull_request：
    # PR 上的全矩阵漂移是既成事实，反复报只会变成噪音，PR 还要多等一分钟。
    #
    # 复发背景：oagentkit/agent#8、oagentkit/toolgate#10 是同一类漂移的两份
    # 报告（子依赖发版只动自己 go.mod，没回头抬本仓 require），两份 issue
    # 都建议加一条对齐检查来阻断复发——本 job 就是那条检查的常驻形态。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 第一方依赖地板 vs 远端最新
        # 需要 gh 已认证（上面的 GH_TOKEN），且要联网读 tag——
        # 与 drift job 的离线校验不同，故分开成独立 job。
        continue-on-error: true
        run: python3 scripts/verify_dep_floors.py

      - name: 漂移清单（机器可读）
        continue-on-error: true
        run: python3 scripts/verify_dep_floors.py --json > dep-floors.json

      - name: 上传漂移清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-floors
          path: dep-floors.json

  drift:
    name: versions.json drift
    # modules.json 是单一数据源，versions.json 是它的生成物。
    # 两者漂移时，消费方读到的包清单 / import 路径 / 分层全是错的，
    # 而 matrix-docs 的 verify_docs 只比 llms.txt 与 modules.json，不覆盖这里。
    #
    # 比对时忽略三个「环境相关」字段：latest（联网读 tag）、breakingIndex
    # （读各仓 CHANGELOG）、depFloor（读各仓 go.mod）——离线 CI 只 checkout
    # 了本仓，这些字段重生成必然是空的，拿来比就是天天假红。
    #
    # ⚠️ 忽略必须与门禁成对：这三个字段各自有**联网对账门禁**守着
    # （verify_breaking_index.py / verify_dep_floor.py，在 matrix-truth job 里跑）。
    # 只忽略不补门禁，字段就成了没人守的声明。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: versions.json 与 modules.json 一致（忽略环境相关字段）
        # 比对时忽略 latest / breakingIndex / depFloor —— 它们按设计要读
        # 矩阵外的仓（tag / CHANGELOG / go.mod），离线 CI 里必然取不到值。
        # 它们的真实性由 matrix-truth job 的联网对账门禁负责。
        run: python3 scripts/verify_versions_drift.py

      - name: llms.txt 可确定性重生成
        # llms.txt 本身在站点仓，本仓只验「生成是确定的」：
        # 连跑两次结果不同就说明生成器里有随机性/时间戳，那是漂移的根源。
        run: |
          set -euo pipefail
          python3 scripts/gen_llms_txt.py --matrix modules.json --out /tmp/llms.a.txt
          python3 scripts/gen_llms_txt.py --matrix modules.json --out /tmp/llms.b.txt
          if diff -q /tmp/llms.a.txt /tmp/llms.b.txt; then
            echo "✅ 生成确定"
          else
            echo "❌ 两次生成结果不同"; exit 1
          fi

  site-modules-copy:
    name: Site modules.json copy (站点副本 vs 矩阵源)
    # modules.json 是矩阵的单一数据源；站点仓 data/modules.json 是它的**副本**。
    # 这件事三处都有明文：站点 AGENTS.md「内容必须逐字段一致」「禁止在本仓单方面
    # 发明模块信息」、CONTRIBUTING 发版第 4 步「同步站点 data/modules.json」——
    # 但此前**一处机器校验都没有**：verify_docs.py 守 llms.txt、
    # verify_versions_drift.py 守 versions.json，两者都不碰 data/modules.json；
    # 站点仓自己的 CI 只验「生成物 vs 站点自己的副本」，副本本身烂掉它照样绿；
    # release.py sync-matrix 也只拷 versions.json ⇒ 那句同步是纯手工动作。
    # 2026-10-21 就这么漏过一次（站点副本缺 llm/port，CONTRIBUTING 有实测记录）。
    #
    # 为什么挂 push/schedule 而不挂 PR：副本在**另一个仓**，而纪律是
    # **源先、副本后**（源 PR 先合、副本 PR 后合）——PR 事件里拿 PR 的 modules.json
    # 去比站点 main 的副本，必然红，而且红得没法在 PR 内自愈。
    # 本 job 在**源仓 main** 上比对：源改了、副本没同步 ⇒ 红灯；
    # 副本补齐（站点 PR 合并）后靠每日 schedule 自愈——
    # 与 .github 仓那份「站点 versions.json 副本」检查同一形态。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone 站点仓（取它的 data/modules.json 副本）
        # 公开仓，走 HTTPS 匿名克隆即可（与 matrix-local-guards 克隆各模块仓同法）。
        run: git clone -q --depth 1 https://github.com/oagentkit/oagentkit.github.io.git site

      - name: 站点 data/modules.json 与矩阵源逐字段一致
        # 副本漂了 ⇒ 站点对外清单（13 个模块页 / 首页矩阵表 / 依赖图）与权威源矛盾，
        # 而 llms.txt 仍与源一致 ⇒ 两套互相矛盾的对外清单
        # （站点 AGENTS.md 点名的形态）。修法：源先、副本后。
        run: python3 scripts/verify_modules_copy.py --matrix modules.json --compare site/data/modules.json

  matrix-local-guards:
    name: Matrix local guards (层级方向 / 门面规则 / 仓文档)
    # 需要**各仓源码**才能判定的守卫集中在这里：克隆一次，多条守卫共用。
    #
    # 为什么必须读真实源码而不是声明：
    #   modules.json 的 dependsOn 是**声明**，它会漂（实测 llm 声明依赖 obs/runtime，
    #   而代码里早已不引）。在一个漂了的声明图上做层级校验，等于什么都没校验。
    #   旧的 verify_split.py 就是这么做的，而且它没被任何 CI 引用、数据路径也已失效。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: matrix-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        # 层级方向守卫用 `go list` 取**编译器视角**的真实 import——
        # 源码正则认不出 build tag 与 import 别名。
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: matrix-tools/go.sum

      - name: Clone 矩阵各仓
        # 清单来自 modules.json（单一数据源），不写死仓名。
        # depth 1 即可：层级方向只看源码与 go.mod，不需要历史。
        run: |
          set -euo pipefail
          while IFS= read -r repo; do
            [ "$repo" = "matrix-tools" ] && continue
            [ "$repo" = "oagentkit.github.io" ] && continue
            [ "$repo" = ".github" ] && continue
            git clone -q --depth 1 "https://github.com/oagentkit/${repo}.git" "${repo}"
          done < <(python3 -c "
          import json, pathlib
          d = json.loads(pathlib.Path('matrix-tools/modules.json').read_text())
          print('\n'.join(m['repo'] for m in d['modules']))
          ")
          # 门面仓不在 modules 里（它不是矩阵模块，是兼容层），单独克隆
          git clone -q --depth 1 "https://github.com/oagentkit/agentkit.git" agentkit

      - name: 第一方依赖方向（tier 方向 / 依赖声明对账 / 矩阵内不消费门面）
        run: python3 matrix-tools/scripts/verify_import_direction.py --root .

      - name: 门面不得新增包（规则级）
        # 判据取自门面自己的 README 废弃声明 + git 历史，**不依赖**冻结快照。
        run: python3 matrix-tools/scripts/verify_facade_no_new_packages.py --facade agentkit

      - name: 门面包覆盖与迁移映射
        # 含 MIGRATION.md ↔ alias.go 的对应校验——实测「port 包有转发但迁移表漏行」
        # 就是靠这条防住的。
        run: python3 matrix-tools/scripts/verify_facade_packages.py --facade agentkit

      - name: 各仓文档与矩阵声明的差异（报告器）
        # ⚠️ 这是**报告器**，不是门禁，恒不失败。
        #
        # 为什么不能当门禁：13 个仓的 README/AGENTS.md **全部**与 gen_docs.py
        # 的骨架有差异——因为仓库版本是**手写丰富的那个**（queue 的选主红线、
        # textx 的包级细节…），而生成器只产骨架。实测 26 个文档无一例外。
        # 把它当门禁 ⇒ 恒红 ⇒ 与「红了就加豁免」同命。
        #
        # 它的价值是「modules.json 更新后，生成器比仓库新」这个方向——
        # 那才是「该重新生成」的情形。这个方向由人看报告决定。
        continue-on-error: true
        run: python3 matrix-tools/scripts/verify_repo_docs.py --mirror .

      - name: 上传文档差异报告
        if: always()
        run: |
          set -euo pipefail
          python3 matrix-tools/scripts/verify_repo_docs.py --mirror . > repo-docs-drift.txt 2>&1 || true
          echo "差异行数：$(wc -l < repo-docs-drift.txt)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-docs-drift
          path: repo-docs-drift.txt

  pending-release:
    name: Pending release (预写段可观测)
    # 「预写段被重生成吞掉」这个状态以前**对所有门禁都不可见**：
    # CHANGELOG 覆盖门禁从提交版里找待发版段，段没了它就无对象可比。
    #
    # 只在 push / 定时跑（不挂 PR）：它需要**完整历史**（要读 CHANGELOG.md 的
    # 提交历史才能判断「曾经有过待发版段」），克隆成本高于 PR 场景值得付的。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: matrix-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone 矩阵各仓（完整历史）
        # 必须是完整克隆：浅克隆没有历史，看不到「预写段曾经存在」。
        run: |
          set -euo pipefail
          while IFS= read -r repo; do
            [ "$repo" = "matrix-tools" ] && continue
            [ "$repo" = "oagentkit.github.io" ] && continue
            [ "$repo" = ".github" ] && continue
            git clone -q "https://github.com/oagentkit/${repo}.git" "${repo}"
          done < <(python3 -c "
          import json, pathlib
          d = json.loads(pathlib.Path('matrix-tools/modules.json').read_text())
          print('\n'.join(m['repo'] for m in d['modules']))
          ")

      - name: 待发版段可观测性（黄灯）
        run: python3 matrix-tools/scripts/verify_pending_release.py --root .

  latest-field:
    name: Latest field (latest ↔ 远端最新 tag)
    # versions.json 是机器可读权威源，它的 latest 字段写着每个仓的「当前最新版本」。
    # 实测：facade 的 latest 停在 v1.8.20，而真实 tag 已是 v1.8.21，
    # 而 drift 门禁**明确忽略** latest（离线取不到），全 CI 无人在查——
    # 「忽略 + 补门禁」必须成对，这里就是那一条。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: matrix-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: latest 字段对账
        # 取不到 ⇒ 黄灯（判不了 ≠ 没问题），不判绿。
        run: python3 matrix-tools/scripts/verify_latest_field.py --org oagentkit

  inventory:
    name: Invariant inventory (承诺 ↔ 判据 ↔ 接线)
    # 每条不变量都必须有：判据脚本 + CI 接线。缺任何一件，这条承诺就是假的。
    #
    # 这条门禁守的是**治理本身**：矩阵反复出现的失败形态是
    # 「文档承诺由脚本强制校验 ≠ 实际有脚本在强制校验」。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: matrix-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone 规则仓（登记表引用了两个 CI 文件）
        # 登记表里记着两个 CI 文件的路径：matrix-tools 自己的与规则仓的。
        # 少克隆一个，门禁就会报「登记的 CI 文件找不到」——那是真话：
        # 在只看得到一个 CI 文件的环境里，跨仓的那几条承诺确实无法验证。
        run: git clone -q --depth 1 "https://github.com/oagentkit/.github.git" .github

      - name: 安装 pyyaml
        # 触发条件校验要解析 workflow YAML（on: 与 job 级 if:）。
        # 显式装，不靠 runner 镜像/解释器预装的 pyyaml——那是不确定因素。
        run: python3 -m pip install --quiet pyyaml

      - name: 不变量登记表核对
        run: python3 matrix-tools/scripts/verify_inventory.py --root .

  receipts:
    name: Receipts (issue 回执落地)
    # issue 被 **PR 正文 `Closes #N` 在合入时自动关闭**时，回执评论可能**一条都没留下**。
    #
    # 机制上的原因：`gh issue close --comment` 对**已关闭**的 issue 会**静默不贴评论**
    # （打印 `! Issue ... is already closed` 并以 0 退出）——退出码仍是 0，
    # 按退出码判成功的收尾脚本会误报「已回执」。
    # 实测（issue matrix-tools#71）：llm#29 被 PR#32 自动关闭、0 条评论，
    # 而 PR CI 全绿、修复随 llm v0.15.0 发布 ⇒ **关单成功、CI 绿、tag 已打，
    # 没有任何地方会报错**。
    #
    # 判据只取**产物**（issue 上真的有没有回执型评论），不看任何命令的退出码。
    # 范围收敛到「**被机器自动关闭**」这一形态：人工 gh issue close 关掉的 issue
    # 本来就不该有回执，算进来就是上线即一片红。
    #
    # 关闭来源取**两个来源的并集**（issue matrix-tools#88）：
    #   - `closedByPullRequestsReferences` 非空 ⇒ 被 PR 关闭（含跨仓 PR）；
    #   - issue 时间线的 `closedEvent.closer` 是 PR / Commit ⇒ 被机器关闭
    #     （**Commit 这一支是 commit message 里的关闭关键词**——squash 合并把
    #     commit message 带进 main，`Closes #N` 照样触发自动关单，而
    #     `closedByPullRequestsReferences` 在那条路上是**空的**）。
    # 回执判据要求**锚点**（PR 链接 / 版本号 / 完整提交 sha）：
    # 认领/派单评论里也会出现「验收」二字 ⇒ 旧判据把它当回执 ⇒
    # 「关单成功但零回执」从那条缝里溜过去。
    #
    # ⚠️ **硬失败**（不再是 continue-on-error）：判据既然准了、范围也有了归属地，
    #    结论就该落到 CI 上（issue matrix-tools#90）。
    #
    # 范围（--ci --scope-mode repo）：
    #   PR / push 事件 → **只判 matrix-tools 自己仓的 issue**（归属地）；
    #   schedule 事件  → **全矩阵**（每日 06:17 的跨仓硬失败归属地：
    #                    别的仓的缺口到这里才判红，不去背别人的红）。
    #   ⚠️ PR 事件的口径恒为「PR 的 base 仓」⇒ 别的仓的 issue 的缺口
    #     不会把本仓的 PR 弄红（那正是 #90 要消灭的跨仓误伤）。
    #
    # 「回执还在路上」的容忍窗（判据内置）：回执是**合并之后**才补的（要等 CI、
    # 要打 tag）⇒ 刚关单的缺口在巡检口径下判**黄**而不是红（假红会让人习惯性
    # 忽略红标）；PR 事件严格（容忍窗 0）——那时看到的缺口一定是上一轮合并留下的。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: matrix-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: issue 回执落地对账
        # 「判不了 ≠ 没问题」：取数失败判**黄灯**而不是绿灯——
        # 否则门禁会在网络故障时静默放行，而故障恰好是最需要它的时候。
        # 范围判定只此一份（oracle 的 --ci / --scope-mode），别在这个 YAML 里另造。
        shell: bash
        run: >-
          python3 matrix-tools/scripts/verify_receipts.py
          --ci --org oagentkit --scope-mode repo
          --json-out receipts-report.json

      - name: 上传回执缺口报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts-report
          path: receipts-report.json
          # 脚本崩在写文件之前时不该再红一次——那会把「门禁自己坏了」
          # 伪装成「门禁报了缺口」。
          if-no-files-found: ignore
