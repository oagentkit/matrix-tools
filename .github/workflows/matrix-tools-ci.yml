name: Matrix Tools CI

# 本仓是全矩阵的单一数据源：modules.json 决定 versions.json / llms.txt / 文档 /
# 全部门禁的判定。改错一个包名，下游是「静默失效」而不是「报错」。
#
# 为什么这里必须有 CI：oagentkit/.github 的 matrix-docs job 拉的是本仓的 **main**，
# 不是 PR 分支。所以本仓的 PR 此前**从不被任何东西验证**——
# 新加的守卫脚本要在合并之后才第一次被执行，且失败时已经晚了。
# （实测：verify_facade_release.py 的 PR 就出现过这种顺序依赖，
#   .github 侧先红，报的是「文件不存在」而不是「守卫坏了」。）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每日全矩阵对账。
    #
    # 为什么需要定时跑：这两条门禁守的是「矩阵 vs 各模块仓的真实状态」，
    # 而**模块仓发版不会触发本仓的 CI**——矩阵没改就没有 PR，PR 触发的门禁
    # 也就永远不会看到那次发版。定时跑是唯一能在「别人改了模块仓」时
    # 把矩阵漂移照出来的机制。
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::py_compile ${f}"
            python3 -m py_compile "$f" || fail=1
            echo "::endgroup::"
          done < <(find scripts -name '*.py' -not -path '*/__pycache__/*' | sort)
          exit "$fail"

      - name: --help 冒烟
        # argparse 的脚本必须能被解析出参数；无 argparse 的脚本只要求能跑起来
        # 并以 0/1/2 退出（--help 返回 2 也算通过）。
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "::group::${f} --help"
            set +e
            python3 "$f" --help >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -gt 2 ]; then
              echo "  ✗ exit ${rc}"
              fail=1
            else
              echo "  ✓ exit ${rc}"
            fi
            echo "::endgroup::"
          done < <(find scripts -name '*.py' -not -path '*/__pycache__/*' | sort)
          exit "$fail"

      - name: 路径规则自洽
        # matrix_paths 是「旧→新 import 路径」的规则本体，
        # rewrite_imports / gen_versions / gen_llms_txt 全都 import 它。
        # 规则写错时三处会**一致地错**，普通检查抓不到，所以要有独立断言。
        run: python3 scripts/test_matrix_paths.py

  guards:
    name: Guards self-test
    # 守卫最危险的失效模式是「一直绿，但从没生效过」：
    # 豁免名单写错一个字符、判据写反，它就会静默放过所有违规。
    # 所以每条守卫都必须能证明自己还活着。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          # 门面符号级门禁的符号提取器是 scripts/symdump/main.go（go/parser
          # 程序，只用标准库），但仍需 Go 工具链。显式装一个定版——
          # 不靠 runner 镜像预装的 Go 版本，那是不确定因素。
          go-version: '1.26'

      - name: 门面仓退役守卫自测
        run: python3 scripts/check_facade_imports.py --selftest

      - name: 门面包冻结守卫自测（门面已废弃，不得再长出新包）
        # 门面仓 README 明写「v1.x 退役条件**已满足**，本仓不接受任何新功能」。
        # 「不许再引门面」有机器约束（check_facade_imports.py），
        # 但「门面不得继续长出新包」此前**一条机器约束都没有**——有人加一个新包目录
        # + 一批别名，CI 全绿。这条守卫把那句文档承诺变成红灯。
        #
        # 自测覆盖（离线、真实逻辑，不 mock 判定函数）：
        # 与基线一致→绿 / 新增包→红 / 删包（上游删除场景）→绿 / 新增转发目标→红 /
        # 数量相同但集合不同→红（负向样本）/ 门面自研包→红 / 空门面→判不了。
        run: python3 scripts/verify_facade_frozen.py --selftest

      - name: 门面仓发布地板守卫自测
        # 判据里含「门面接 v0.1.0」这个样本 —— 那是线上真实发生过的形态
        # （agentkit@v1.2.0 的 go.mod 把 13 个内部依赖全钉在 v0.1.0）。
        run: python3 scripts/verify_facade_release.py --selftest

      - name: 依赖地板守卫自测
        # 这条守卫有过一次真实的静默失效：owner/repo 拆分把 owner 拼成
        # "github.com/oagentkit"，于是每个依赖都查不到 tag，报告里 43 条
        # 全是「判不了」却照样 exit 0 —— 一直绿、从没生效过。
        # 所以它的判据纯函数部分必须离线可测，不能只靠联网跑一次。
        run: python3 scripts/verify_dep_floors.py --selftest

      - name: 破坏性变更抽取器自测
        # breakingIndex 的判定规则本体。判据错了整条门禁就是摆设：
        # 漏判 → 矩阵继续说「无破坏性变更」；误判 → 矩阵里塞满假条目。
        run: python3 scripts/breaking_index.py

      - name: 仓库元信息取数层自测
        # tag 过滤必须只认 ^vX.Y.Z：嵌套模块的 tag（audit/v0.1.0）与主模块的
        # tag 在同一个仓里，取错「最新」会把矩阵写成 v0.1.0。
        run: python3 scripts/repo_meta.py

      - name: breakingIndex 对账门禁自测
        run: python3 scripts/verify_breaking_index.py --selftest

      - name: import 路径对账门禁自测
        run: python3 scripts/verify_import_paths.py --selftest

      - name: 门面符号级完整性门禁自测
        # oracle 有效性自测：拿一个**有盲区的被检对象**跑一遍，确认它报得出。
        # 如果 oracle 自己也有同一处盲区，它会对着坏对象说「没问题」，
        # 那门禁就是假通过。样本含八类缺陷：漏转发 / 幽灵转发 / const 降级成 var /
        # type 降级成 var / 泛型函数被误转发 / 泛型函数未登记白名单 /
        # 白名单过期 / 泛型类型不误报。
        run: python3 scripts/verify_facade_symbols.py --selftest

      - name: breakingIndex 独立 oracle 门禁自测
        # 反证：旧解析器（breaking_index.py）漏收的形态——粗体 **BREAKING**、
        # 项目符号里的 BREAKING CHANGE、小写 breaking change、散文描述的
        # import 路径搬家——独立 oracle 必须全部收得到。自测里拿旧解析器
        # 跑同一份样本，确认它确实漏，才能证明 oracle 不是同一处盲区。
        run: python3 scripts/verify_breaking_oracle.py --selftest

      - name: tag ↔ CHANGELOG 对账门禁自测
        # 双向一一对应 / 待发版段豁免 / 存量欠账基线 / 快照里没有 CHANGELOG 豁免。
        run: python3 scripts/verify_changelog_at_tag.py --selftest

      - name: CHANGELOG 覆盖门禁自测（独立 oracle）
        # 两级覆盖判据（issue matrix-tools#41）：条目级 + body 级。
        # 自测含五组：漏条目 / 正文缺失 / 零信息量提交不误报 /
        # 「tag 后有提交但无待发版段 → 不报红」/ subject 回声不误报。
        run: python3 scripts/verify_changelog_coverage.py --selftest

      - name: 发版时刻地板时效门禁自测
        run: python3 scripts/verify_tag_floor.py --selftest

      - name: CHANGELOG 生成器自测（预写→提交→打 tag 端到端自洽）
        # 生成器最危险的失效形态是「看起来生成了正确的文件，但与事后重生成
        # 的结果不一致」——不跑完整流程发现不了，而后果是 .github 的
        # 「各仓 CHANGELOG 未过期」门禁永远红、且越修越红。
        # 自测跑完整流程（临时 git 仓），要求事后重生成与提交版逐字节一致，
        # 且覆盖「直推打 tag」与「走 PR 打 tag」两种发版打法。
        run: python3 scripts/gen_changelogs.py --selftest

      - name: 依赖地板门禁自测
        # tier0/tier1 的地板必须为空——零依赖核心靠这条保证。
        # 这条守卫最危险的失效形态是「豁免名单写太宽」，所以自测里带了负向样本。
        # 自测同时覆盖 depFloor 对账（漏登记 / 多登记 / 内容漂移三个负向样本）——
        # 离线 drift job 忽略 depFloor 之后，它就是这个字段唯一的守门人。
        run: python3 scripts/verify_dep_floor.py --selftest

      - name: Go 地板门禁自测
        # tier0 的 go 指令必须 1.24.x，且 CI go-version 与 go.mod 成对。
        # 自测带负向样本：tier0 地板抬高 / toolchain 超标 / CI 不成对 / 判不了即红，
        # 同时带**不误报**样本——tier1/tier2/tier3 用 1.26 是合法的，不能报成漂移。
        run: python3 scripts/verify_go_floor.py --selftest

  changelog-coverage:
    name: CHANGELOG coverage (独立 oracle)
    # 「两级覆盖」门禁（issue matrix-tools#41）：直接扫**原始 git 历史**算「应当出现的
    # 条目与正文」，与提交版 CHANGELOG.md 比对。
    #
    # 为什么必须**独立于生成器**：门禁若复用 gen_changelogs.py 的解析/渲染函数，
    # 生成器丢 body 时门禁会跟着一起丢——门禁比的正是「丢 body 之后的结果」，
    # 于是门禁全绿而发布说明已经残缺。实测 2026-10-20：7 个仓合计 773 处正文缺失，
    # 逐字节门禁一条都没报出来。
    #
    # 范围按「**谁造成漂移谁负责**」裁剪（issue #41 裁决 2）：
    #   PR 事件 → 只校验**本 PR 触及的仓**（= PR 的 base 仓），且用 **PR head** 的
    #             内容校验（只裁剪不换 ref 解决不了问题：合入前各仓 main 上还是旧产物）；
    #   非 PR 事件（push / 定时 / 手动）→ 全矩阵（**周期性全量审计兜底**，不可省，
    #             否则是漏检）。
    #
    # ⚠️ 本 job 在 matrix-tools 自己的 PR 上是**空跑**（matrix-tools 不在
    # 「有 CHANGELOG 要求的仓」清单里 ⇒ 范围为空）——这正是「无关 PR 不因别的仓
    # 欠账而红」。模块仓的 PR 要各自校验自己，需要在
    # oagentkit/.github 的可复用工作流 go-ci.yml 里加同一个 job（**另一个仓**，
    # 本仓改不到）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存各仓克隆
        # 覆盖判据要读**完整历史**（tag 区间 + 每个 commit 的 body），浅克隆不够用。
        # 缓存命中时只需 fetch 增量，省掉每次重新克隆 14 个仓的时间。
        uses: actions/cache@v4
        with:
          path: ~/.cache/oagentkit/changelog-coverage
          key: changelog-coverage-${{ github.run_id }}
          restore-keys: |
            changelog-coverage-

      - name: CHANGELOG 覆盖（独立 oracle；PR 只查本 PR 触及的仓）
        run: python3 scripts/verify_changelog_coverage.py --ci --org oagentkit

  matrix-truth:
    name: Matrix truth (breakingIndex / import paths)
    # 这三条是**矩阵作为机器可读权威源**的底线：
    #   1. breakingIndex 与各仓 CHANGELOG 一致——否则矩阵说「无破坏性变更」，
    #      而 CHANGELOG 说「import 路径已变」，下游只能先构建断裂才发现；
    #   2. importPath 与各仓真实的 go.mod / 包目录一致——否则机器照着矩阵写
    #      import 直接编译不过；
    #   3. depFloor 与各仓真实 go.mod 的实际地板一致——否则消费者按矩阵判断
    #      「import 这个仓会拖进哪些重依赖」时拿到的是过期信息。
    #
    # 三条都要联网（读各仓的 CHANGELOG / go.mod / 目录树），所以单独一个 job。
    # 「取不到」一律判红：守卫最危险的失效形态是「一直绿，但从没生效过」。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 tag 快照
        # tag 受 protect-tags ruleset 保护**不可变** ⇒ 某个 tag 处的 CHANGELOG.md
        # 内容也不可变 ⇒ (repo, tag, commit sha) 是稳定缓存键。
        # 实测（2026-10-20，14 仓 102 个 tag）：冷缓存 116 次 API 调用 / 46s，
        # 热缓存 **14 次 / 26s**。调用次数才是这个 job 的真正风险——
        # 串行取数曾让本地一次跑挂死 7 小时（#26 加超时后缓解）。
        #
        # key 用 run_id（每轮一个新条目，旧的 7 天后被 GitHub 淘汰），
        # restore-keys 用前缀把上一轮的缓存捞回来 ⇒ 只有**新增的 tag** 需要真的取。
        uses: actions/cache@v4
        with:
          path: ~/.cache/oagentkit/changelog-at-tag
          key: changelog-tag-snapshots-${{ github.run_id }}
          restore-keys: |
            changelog-tag-snapshots-

      - name: breakingIndex ↔ 各仓 CHANGELOG
        run: python3 scripts/verify_breaking_index.py --org oagentkit

      - name: import 路径 ↔ 各仓真实 go.mod / 包目录
        run: python3 scripts/verify_import_paths.py --org oagentkit

      - name: breakingIndex ↔ 各仓 CHANGELOG（独立 oracle）
        # 与上面那条**判据完全解耦**的第二条对账线：上面那条用生成器
        # breaking_index.py 的解析函数，生成器漏收时它跟着一起漏、门禁全绿
        # 而矩阵对下游说谎（oekit 与 oagentkit 都实测过这个形态）。
        # 本条自己扫 CHANGELOG 原文判定，两者结论不一致时以本条为准。
        run: python3 scripts/verify_breaking_oracle.py --org oagentkit

      - name: tag ↔ CHANGELOG 版本节一一对应
        # ① 当前 CHANGELOG 与已发布 tag 双向对应（tag 有 → 段有；段有 → tag 有，
        #    唯一豁免是待发版段）；
        # ② 每个已发布 tag 的**快照**里必须有它自己的版本段——下游 go get 拿到的
        #    是 tag 快照，缺段 = 发布说明残缺（issue matrix-tools#17）。
        run: python3 scripts/verify_changelog_at_tag.py --org oagentkit

      - name: 依赖地板（tier0/tier1 必须无重量级第三方）+ depFloor 对账
        # 一条脚本两件事：① 层位判定（tier0/tier1 地板必须为空）；
        # ② 对账——矩阵 versions.json 登记的 depFloor 必须等于各仓真实
        # go.mod 算出的地板（漏登记 / 多登记 / 内容漂移 / 取不到即红）。
        run: python3 scripts/verify_dep_floor.py --org oagentkit

      - name: Go 地板（tier0 必须 1.24.x）+ CI go-version 与 go.mod 成对
        # ① tier0 的 go 指令必须 1.24.x——tier0 是「需要依赖低版本 Go」的那一类，
        #    抬高地板会把 Go 1.24 用户挡在门外（issue matrix-tools#22）；
        # ② CI go-version 必须与 go.mod 的 go 指令成对——CI 用高版本构建、
        #    go.mod 承诺低版本时，CI 全绿但用户按最低版本编译失败。
        #
        # 判据独立：直接解析各仓 go.mod 与 ci.yml 原文，
        # 不复用任何生成器的推导（共享判断逻辑 = 共同盲区）。
        # tier1 及以上**不设 1.24 约束**——业务层 1.24/1.25/1.26 都合法。
        run: python3 scripts/verify_go_floor.py --org oagentkit

  release-floor:
    name: Release floor (发版时刻的地板时效)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发版时刻的依赖地板时效（各仓最新 tag）
        run: python3 scripts/verify_tag_floor.py --org oagentkit --latest-only

  facade-symbols:
    name: Facade symbols
    # 门面仓 agentkit 的**符号级**转发完整性：上游每个导出符号，门面都要有对应别名。
    #
    # 为什么值得单独一个 job：已有的三条门面守卫查的都不是符号级——
    #   verify_facade_packages.py 只比包名（47/47 通过）
    #   check_facade_imports.py 只查禁用的 import 前缀
    #   verify_facade_release.py 只查版本地板
    # 实测 2026-10-20：门面的 47 个 alias.go 自 2026-10-17 起就没跟上上游，
    # 漏转发 23 个符号、131 处 const 被降级成 var，下游按门面 import 直接编译失败。
    # 而仓里**根本不存在**那个自称在生成 alias.go 的 gen 生成器——
    # 所以这不是「生成器坏了」，是「生成器从来没有过」。
    #
    # 判据是**独立 oracle**：直接读上游源码与门面 alias.go，用 go/parser
    # （scripts/symdump）解析语法树求差集，不比对任何生成物。
    #
    # 为什么必须联网跑：模块仓发版**不会**触发本仓的 CI（矩阵没改就没有 PR），
    # 所以这里的 schedule 是唯一能在「别人改了模块仓」时把门面漂移照出来的机制
    #（与 matrix-truth job 同一理由）。
    #
    # ⚠️ 顺序依赖（本 job 读的是各仓的 main，不是本仓 PR 的内容）：
    # 「先修门面、再装门禁」是刻意的——门禁验证的正是「门面已修好」这个事实。
    # 若门面还没修好就加这条门禁，本仓 PR 会红，且红的原因与 PR 本身无关。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        # 符号提取器是 go/parser 程序（scripts/symdump/main.go），只用标准库，
        # 但要有 go 工具链。版本与全矩阵一致（CI go-version 1.26）。
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 门禁自测（oracle 有效性）
        # 守卫最危险的失效形态是「一直绿，但从没生效过」：
        # oracle 自己有盲区时，它会对着坏门面说「没问题」，那是假通过。
        # 自测拿一个**故意造坏**的被检对象跑一遍，要求它把每类缺陷都报出来。
        run: python3 scripts/verify_facade_symbols.py --selftest

      - name: 门面符号级转发完整性
        # 取不到即红：守卫最危险的形态是「一直绿，但从没生效过」。
        run: python3 scripts/verify_facade_symbols.py --org oagentkit

  facade-frozen:
    name: Facade frozen (不得长新包)
    # 门面仓 agentkit 已废弃：README 首行「门面仓 · 已废弃」，
    # 「v1.x 退役条件**已满足**。本仓不接受任何新功能，只做别名转发与安全修复」。
    #
    # 为什么值得单独一个 job：已废弃的语义是「只保留既有兼容面、不接受新功能」，
    # 而「新增包」正是门面继续长胖的主要形态。此前这一半**只有文档约束**：
    #   - 「不许再引门面」有机器约束（check_facade_imports.py）；
    #   - 「门面不得再长出新包」**一条机器约束都没有**——有人往门面加一个新包目录
    #     + 一批别名，CI 全绿，只有 48 个 alias.go 的 diff 可见性。
    # 本 job 就是后一条的红灯。
    #
    # 判据是**单向**的：门面的实际包集合 ⊆ 冻结基线
    # （scripts/facade_package_baseline.json，2026-10-20 的人工快照）。
    # 反向不查——上游模块真删包时，门面跟着删是对的（否则 alias.go 编译不过）。
    #
    # ⚠️ 顺序依赖（与 facade-symbols 同理）：本 job 读的是**门面仓 main** 的快照，
    # 不是本仓 PR 的内容。基线与门面当前是对齐的（48 = 48），所以装这条门禁时本仓 PR 是绿的。
    #
    # 「取不到」的处理是分开的：**网络失败/状态判不了 ⇒ 判红**（判不了不能当成「没问题」）；
    # **门面仓确实不存在 ⇒ 判绿**（门面不在 ⇒「门面继续生长」物理上不可能发生）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 门面包冻结（不得新增）
        # 取不到即红：守卫最危险的形态是「一直绿，但从没生效过」。
        run: python3 scripts/verify_facade_frozen.py --org oagentkit

  dep-floors:
    name: Dep floors (report)
    # ⚠️ 这是**报告器**，不是门禁，恒不失败。
    #
    # 依赖地板漂移在设计上就是常态：任何一次子仓发版都会让下游全部变落后。
    # 做成硬门禁等于要求每个仓在每次子仓发版后都跟着发一版，这是发版跑步机，
    # 长期只会训练出「红了就加豁免」的习惯。漂移的**判定**放在
    # `--enforce`（发版 runbook 手动跑），这里只负责让漂移**可见**。
    #
    # 只在 push 到 main / 定时 / 手动时跑，不挂 pull_request：
    # PR 上的全矩阵漂移是既成事实，反复报只会变成噪音，PR 还要多等一分钟。
    #
    # 复发背景：oagentkit/agent#8、oagentkit/toolgate#10 是同一类漂移的两份
    # 报告（子依赖发版只动自己 go.mod，没回头抬本仓 require），两份 issue
    # 都建议加一条对齐检查来阻断复发——本 job 就是那条检查的常驻形态。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 第一方依赖地板 vs 远端最新
        # 需要 gh 已认证（上面的 GH_TOKEN），且要联网读 tag——
        # 与 drift job 的离线校验不同，故分开成独立 job。
        continue-on-error: true
        run: python3 scripts/verify_dep_floors.py

      - name: 漂移清单（机器可读）
        continue-on-error: true
        run: python3 scripts/verify_dep_floors.py --json > dep-floors.json

      - name: 上传漂移清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-floors
          path: dep-floors.json

  drift:
    name: versions.json drift
    # modules.json 是单一数据源，versions.json 是它的生成物。
    # 两者漂移时，消费方读到的包清单 / import 路径 / 分层全是错的，
    # 而 matrix-docs 的 verify_docs 只比 llms.txt 与 modules.json，不覆盖这里。
    #
    # 比对时忽略三个「环境相关」字段：latest（联网读 tag）、breakingIndex
    # （读各仓 CHANGELOG）、depFloor（读各仓 go.mod）——离线 CI 只 checkout
    # 了本仓，这些字段重生成必然是空的，拿来比就是天天假红。
    #
    # ⚠️ 忽略必须与门禁成对：这三个字段各自有**联网对账门禁**守着
    # （verify_breaking_index.py / verify_dep_floor.py，在 matrix-truth job 里跑）。
    # 只忽略不补门禁，字段就成了没人守的声明。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: versions.json 与 modules.json 一致（忽略环境相关字段）
        # 比对时忽略 latest / breakingIndex / depFloor —— 它们按设计要读
        # 矩阵外的仓（tag / CHANGELOG / go.mod），离线 CI 里必然取不到值。
        # 它们的真实性由 matrix-truth job 的联网对账门禁负责。
        run: python3 scripts/verify_versions_drift.py

      - name: llms.txt 可确定性重生成
        # llms.txt 本身在站点仓，本仓只验「生成是确定的」：
        # 连跑两次结果不同就说明生成器里有随机性/时间戳，那是漂移的根源。
        run: |
          set -euo pipefail
          python3 scripts/gen_llms_txt.py --matrix modules.json --out /tmp/llms.a.txt
          python3 scripts/gen_llms_txt.py --matrix modules.json --out /tmp/llms.b.txt
          if diff -q /tmp/llms.a.txt /tmp/llms.b.txt; then
            echo "✅ 生成确定"
          else
            echo "❌ 两次生成结果不同"; exit 1
          fi
